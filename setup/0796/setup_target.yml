- name: Setup target
  hosts: all
  vars:
    vcvars_path: "{{ ansible_env['ProgramFiles'] }}\\Microsoft Visual Studio\\2022\\Community\\VC\\Auxiliary\\Build\\vcvars64.bat"
    dest_path: "C:\\"
    wdk_include_km_path: "C:\\Program Files (x86)\\Windows Kits\\10\\include\\10.0.17763.0\\km"
    wdk_lib_path: "C:\\Program Files (x86)\\Windows Kits\\10\\Lib\\10.0.17763.0\\km\\x64"
    ntoskrnllib_path: "C:\\Program Files (x86)\\Windows Kits\\10\\Lib\\10.0.17763.0\\km\\x64\\ntoskrnl.lib"

    smb_guest_script: /opt/tools/smb_guest.py   # 스크립트 위치
    smb_host: "192.168.100.1"                    # 필수: SMB 서버 IP/호스트
    smb_port: 445                               # 선택
    smb_name: "fileserver.local"                # 선택(NetBIOS/호스트 이름). 없으면 smb_host 사용
    smb_share: "Public"                         # 선택(없으면 전체 공유 목록)
    smb_path: "*"                               # 선택

    enable_guest: true
    also_grant_everyone: true            # Guest 외 Everyone도 허용하려면 true

    shared_path: 'C:\Shared'          # NTFS 권한을 줄 폴더 경로
    share_name:  'Shared'              # (옵션) NullSessionShares에 허용할 공유명
    guest_rights: 'ReadAndExecute'     # Guest 권한 (ReadAndExecute | Modify | FullControl)
    anon_rights:  'ReadAndExecute'     # Anonymous 권한 (위와 동일 옵션)

    target_reject_unencrypted: false

    smb_restart_service: true            # 설정 후 LanmanServer 재시작
    smb_target_shares_exclude:
      - ADMIN$
      - C$
      - IPC$
      - PRINT$
    
    smb_enforce_smb311_dialect: true      # 3.1.1 고정 원치 않으면 false
    smb_restart_services_only: true       # 변경 시 서비스 재시작, 재부팅 안 함

  tasks:
    
    #  signing?
    - name: "[SMB] 현재 Server/Client 설정 조회"
      win_shell: |
        $s = Get-SmbServerConfiguration | Select RequireSecuritySignature, EnableSecuritySignature, EncryptData, RejectUnencryptedAccess, Smb2DialectMin, Smb2DialectMax
        $c = Get-SmbClientConfiguration | Select RequireSecuritySignature, EnableSecuritySignature, RequireSecureNegotiate, Smb2DialectMin, Smb2DialectMax
        [PSCustomObject]@{Server=$s; Client=$c} | ConvertTo-Json -Compress
      args:
        executable: powershell.exe
      register: smb_before
      changed_when: false
      tags: [smb_signing]

    - name: "[SMB] Server 측 서명/암호화 요구 비활성 + (선택) SMB311 고정"
      win_shell: |
        Set-SmbServerConfiguration -RequireSecuritySignature $false -EnableSecuritySignature $false -Confirm:$false
        Set-SmbServerConfiguration -RejectUnencryptedAccess $false -Confirm:$false
        Set-SmbServerConfiguration -EncryptData $false -Confirm:$false
        if ({{ smb_enforce_smb311_dialect | ternary('$true','$false') }}) {
          Set-SmbServerConfiguration -Smb2DialectMin SMB311 -Smb2DialectMax SMB311 -Force -Confirm:$false
        }
        Get-SmbServerConfiguration | Select RequireSecuritySignature, EnableSecuritySignature, EncryptData, RejectUnencryptedAccess, Smb2DialectMin, Smb2DialectMax | ConvertTo-Json -Compress
      args:
        executable: powershell.exe
      register: smb_server_after
      tags: [smb_signing]

    - name: "[SMB] Client 측 서명 요구/보안협상 요구 비활성 + (선택) SMB311 고정"
      win_shell: |
        Set-SmbClientConfiguration -RequireSecuritySignature $false -EnableSecuritySignature $false -Confirm:$false
        Set-SmbClientConfiguration -RequireSecureNegotiate $false -Confirm:$false
        if ({{ smb_enforce_smb311_dialect | ternary('$true','$false') }}) {
          Set-SmbClientConfiguration -Smb2DialectMin SMB311 -Smb2DialectMax SMB311
        }
        Get-SmbClientConfiguration | Select RequireSecuritySignature, EnableSecuritySignature, RequireSecureNegotiate, Smb2DialectMin, Smb2DialectMax | ConvertTo-Json -Compress
      args:
        executable: powershell.exe
      register: smb_client_after
      tags: [smb_signing]

    - name: "[SMB] 변경 여부 판단"
      set_fact:
        smb_changed: >-
          {{
            (
              (smb_before.stdout | default('{}') | from_json).Server.RequireSecuritySignature
              != (smb_server_after.stdout | default('{}') | from_json).RequireSecuritySignature
            )
            or
            (
              (smb_before.stdout | default('{}') | from_json).Client.RequireSecuritySignature
              != (smb_client_after.stdout | default('{}') | from_json).RequireSecuritySignature
            )
            or
            (
              (smb_before.stdout | default('{}') | from_json).Server.Smb2DialectMin
              != (smb_server_after.stdout | default('{}') | from_json).Smb2DialectMin
            )
            or
            (
              (smb_before.stdout | default('{}') | from_json).Client.Smb2DialectMin
              != (smb_client_after.stdout | default('{}') | from_json).Smb2DialectMin
            )
          }}
      tags: [smb_signing]

    - name: "[SMB] Lanman 서비스 재시작(변경 시)"
      win_service:
        name: "{{ item }}"
        state: restarted
        start_mode: auto
      loop:
        - LanmanServer
        - LanmanWorkstation
      when: smb_changed and smb_restart_services_only
      tags: [smb_signing]

    - name: "[SMB] (선택) 재부팅(서비스 재시작 대신)"
      win_reboot:
        reboot_timeout: 600
      when: smb_changed and (not smb_restart_services_only)
      tags: [smb_signing]

    - name: "[SMB] 최종 설정 검증/출력"
      win_shell: |
        $s = Get-SmbServerConfiguration | Select RequireSecuritySignature, EnableSecuritySignature, EncryptData, RejectUnencryptedAccess, Smb2DialectMin, Smb2DialectMax
        $c = Get-SmbClientConfiguration | Select RequireSecuritySignature, EnableSecuritySignature, RequireSecureNegotiate, Smb2DialectMin, Smb2DialectMax
        [PSCustomObject]@{Server=$s; Client=$c} | ConvertTo-Json -Compress
      args: { executable: powershell.exe }
      register: smb_final
      changed_when: false
      tags: [smb_signing]

    - name: "[SMB] 결과 요약 (jmespath 없이)"
      debug:
        msg:
          - "SMB Server: {{ (smb_final.stdout | from_json).Server }}"
          - "SMB Client: {{ (smb_final.stdout | from_json).Client }}"
      tags: [smb_signing]
    # smb shared and mount
    - name: Create share folder
      win_file:
        path: C:\Shared
        state: directory

    - name: Setup share folder
      win_share:
        name: Shared
        path: C:\Shared
        description: "shared folder created by Ansible"
        full: Everyone
        state: present

    - name: Create file with content directly
      win_copy:
        content: |
          This file was created by Ansible.
          You can put any text here.
        dest: C:\Shared\ansible_created.txt
    
    # - name: SMB server – disable signing/encryption requirements (keep compression capability)
    #   ansible.windows.win_shell: |
    #     Set-SmbServerConfiguration -RequireSecuritySignature $false -EnableSecuritySignature $false -Force
    #     Set-SmbServerConfiguration -RejectUnencryptedAccess $false -EncryptData $false -Force
    #     try {
    #       Set-SmbServerConfiguration -EnableSMB2Compression $true -Force
    #     } catch { Write-Output 'EnableSMB2Compression not available on this OS/version' }
    #   args: { executable: powershell.exe }
      
    # guest enable
    - name: Ensure Guest account is enabled
      win_user:
        name: Guest
        state: present
        account_disabled: false
      when: enable_guest    
    # authorization
    - name: Grant Access this computer from the network
      win_user_right:
        name: SeNetworkLogonRight
        users: >-
          {{
            (['Guest'] +
             (['Everyone'] if also_grant_everyone else []))
          }}
        action: add

    - name: Ensure Guest is not denied network logon
      win_user_right:
        name: SeDenyNetworkLogonRight
        users:
          - Guest
        action: remove

    # for anonymous access
    # 1) 익명 허용 공유 지정
    - name: Allow anonymous to this share via NullSessionShares
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
        name: NullSessionShares
        type: multistring
        data:
          - "{{ share_name }}"
      register: reg_nullsessionshares

    # 2) ForceGuest 비활성화
    - name: Disable ForceGuest
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
        name: ForceGuest
        type: dword
        data: 0
      register: reg_forceguest
      failed_when: false

    # 3) (선택) 공유 권한에 ANONYMOUS LOGON 추가
    - name: Share ACL - Add ANONYMOUS LOGON (Read)
      ansible.windows.win_shell: |
        Grant-SmbShareAccess -Name {{ share_name }} -AccountName "ANONYMOUS LOGON" -AccessRight Read -Force
      args: { executable: powershell.exe }
      failed_when: false

    # related to run SMB server
    - name: Enable SMBv1 Protocol
      win_optional_feature:
        name: SMB1Protocol
        state: present

    - name: Enable File and Printer Sharing (SMB-In)
      win_firewall_rule:
        name: File and Printer Sharing (SMB-In)
        enabled: yes
        direction: in
        action: allow

    - name: Enable File and Printer Sharing (SMB-Out)
      win_firewall_rule:
        name: File and Printer Sharing (SMB-Out)
        enabled: yes
        direction: out
        action: allow

    - name: Enable SMBDirect rule (optional)
      win_firewall_rule:
        name: File and Printer Sharing over SMBDirect (iWARP-In)
        enabled: yes
        direction: in
        action: allow
      ignore_errors: yes 

    - name: Allow SMB (port 445) on firewall
      win_firewall_rule:
        name: "Allow SMB for Loopback"
        localport: 445
        protocol: tcp
        direction: in
        action: allow
        profile: 
          - domain
          - private
          - public
        state: present
    
    - name: Enable File and Printer Sharing group in firewall
      win_shell: |
        Set-NetFirewallRule -DisplayGroup 'File and Printer Sharing' -Enabled True -Profile Any -Action Allow

    - name: Enable all SMB-In firewall rules
      win_shell: |
        Get-NetFirewallRule -DisplayName '*SMB-In*' | Set-NetFirewallRule -Enabled True

    # anonymous related setting
    - name: Ensure LanmanServer loopback access registry key exists
      win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
        name: RestrictNullSessAccess
        data: 0
        type: dword
        state: present

    - name: Ensure NullSessionShares is present (optional)
      win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
        name: NullSessionShares
        data: []
        type: multistring
        state: present

    - name: Set EveryoneIncludesAnonymous to 1
      win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
        name: EveryoneIncludesAnonymous
        data: 1
        type: dword

    - name: Set RestrictAnonymous to 0
      win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
        name: RestrictAnonymous
        data: 0
        type: dword

    # NTFS
    - name: NTFS - Grant Guest on {{ shared_path }}
      ansible.windows.win_acl:
        path: "{{ shared_path }}"
        user: "Guest"
        rights: "{{ guest_rights }}"
        type: allow
        state: present
        inherit: "ContainerInherit, ObjectInherit"
        propagation: "None"

    - name: NTFS - Grant ANONYMOUS LOGON explicitly (SID S-1-5-7)
      ansible.windows.win_acl:
        path: "{{ shared_path }}"
        user: "S-1-5-7"   # NT AUTHORITY\ANONYMOUS LOGON
        rights: "{{ anon_rights }}"
        type: allow
        state: present
        inherit: "ContainerInherit, ObjectInherit"
        propagation: "None"
      # when: not grant_via_everyone

    - name: NTFS - (대안) Everyone에 권한 부여해 Anonymous에 간접 적용
      ansible.windows.win_acl:
        path: "{{ shared_path }}"
        user: "Everyone"
        rights: "{{ anon_rights }}"
        type: allow
        state: present
        inherit: "ContainerInherit, ObjectInherit"
        propagation: "None"
      # when: grant_via_everyone

    - name: Disable Loopback Check to allow SYSTEM access to 127.0.0.1
      win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
        name: DisableLoopbackCheck
        data: 1
        type: dword
        state: present

    - name: Allow local login with blank passwords  
      win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
        name: LimitBlankPasswordUse
        data: 0
        type: dword
        state: present
    
    - name: Relax null session restriction
      win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
        name: RestrictNullSessAccess
        data: 0
        type: dword
    
    - name: "Allow guest access to SMB shares"
      win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters
        name: AllowInsecureGuestAuth
        type: dword
        data: 1

