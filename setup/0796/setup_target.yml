    #   win_shell: |
    #     Add-MpPreference -ExclusionPath 'C:\Temp'
    #     Add-MpPreference -ExclusionProcess 'C:\Python311\python.exe'
    #   args: { executable: powershell.exe }
    #   ignore_errors: yes
    
    # - name: Install/upgrade impacket (latest)
    #   win_command: "py -m pip install --upgrade impacket==0.12.0"
    #   register: impacket_install
    #   # changed_when: "'Requirement already satisfied' not in (impacket_install.stdout | default('')) and 'already up-to-date' not in (impacket_install.stdout | default(''))"

    # - name: Install/upgrade lznt1 (latest)
    #   win_command: "py -m pip install --upgrade lznt1"
    #   register: lznt1_install

    - name: Set default value for target_harness
      set_fact:
        target_harness: 'provision_target'
      when: target_harness is undefined

    - name: Upload binaries
      win_copy:
        src: bin
        dest: "{{ dest_path }}"

     # win_service cannot create kernel level services
    - name: Set service to start Call Stack Dump.sys at boot
      win_command: "sc create hook binPath= {{ dest_path + '/bin/driver/Harness_for_nyx.sys' | ansible.windows.quote }} type= kernel start= auto"
      register: result
      failed_when:
        - result.rc != 0
        - result.rc != 1073 # service already exists

    # Agent append to Service
    - name: Set service to start vuln_test to trigger the driver
      win_service:
        name: vuln_driver_trigger
        path: "{{ dest_path }}\\bin\\driver\\vuln_test.exe"
        start_mode: auto

    # Execute server Process in the this
    - name: Set service to Vuln Target
      win_command: "sc create WDM binPath= {{ dest_path + '/bin/driver/wdm.sys' | ansible.windows.quote }} type= kernel start= auto"
      register: result_wdm
      failed_when:
        - result_wdm.rc != 0
        - result_wdm.rc != 1073 # service already exists
    # ## 스페이스바를 써야함...
      when: target_harness == 'provision_target'

